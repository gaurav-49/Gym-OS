# Deploy GYM OS to the Oracle Cloud server.
#
# Run it from the Actions tab (or `gh workflow run deploy.yml`). The runner
# checks out this repo, then pipes the deploy script (install.sh or
# migrate-to-shared.sh, whichever mode calls for) straight to the server over
# SSH — the server never fetches anything from GitHub itself. That's
# deliberate: it means the same content the workflow is running from is what
# runs on the server, with no dependency on raw.githubusercontent.com (which
# has 404'd for entire repos before, unrelated to anything in this file) or
# on propagation delay after a push.
#
# The difference from running it by hand is that the key lives in GitHub's
# encrypted secrets rather than on somebody's laptop, and every deploy leaves
# a log.
#
# Two modes, picked by the "shared_edge" input:
#
#   standalone (default) — GYM OS owns the server, runs deploy/install.sh,
#     gets its own Caddy on 80/443.
#
#   shared_edge — the server also runs another app (InsightRAG) with its own
#     Caddy already on 80/443. Runs deploy/edge/migrate-to-shared.sh instead,
#     which puts one shared Caddy in front of both. See docs/deployment.md,
#     "Hosting alongside another app on the same server", before using this.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#
#   ORACLE_HOST         the instance's public IP or hostname
#   ORACLE_USER         the SSH user — 'ubuntu' on Oracle's Ubuntu images
#   ORACLE_SSH_KEY      the PRIVATE key, whole file including the
#                       -----BEGIN ... ----- and -----END ... ----- lines
#
# Optional:
#
#   ORACLE_KNOWN_HOSTS  output of `ssh-keyscan <host>`. Set it to pin the
#                       server's host key. Without it this workflow accepts
#                       whatever key the host presents on the first connect,
#                       which trusts the network for that moment.
#
#   GYMOS_ADMIN_PASSWORD  password for GYM OS's first staff account. A secret
#                       rather than an input on purpose: inputs are echoed
#                       into the run log, and a public repository's logs are
#                       public. Leave it unset and the deploy generates one
#                       and writes it to /opt/gym-os/db/.admin-credentials on
#                       the server (chmod 600) instead of printing it.
#                       Ignored once a staff account exists.

name: Deploy to Oracle

on:
  workflow_dispatch:
    inputs:
      shared_edge:
        description: "Server also hosts another app (InsightRAG) — use the shared Caddy migration instead of standalone install"
        type: boolean
        default: false
      domain:
        description: "[standalone] Public hostname (blank = <public-ip>.sslip.io)"
        required: false
        default: ""
      seed_demo:
        description: "[standalone] Also load the demo gym (120 members, every module)"
        type: boolean
        default: false
      timezone:
        description: "[standalone] Local time for reports, schedules and expiry dates"
        required: false
        default: "Asia/Kolkata"
      insightrag_domain:
        description: "[shared_edge] InsightRAG's hostname, e.g. insightrag.YOUR-IP.sslip.io"
        required: false
        default: ""
      gymos_domain:
        description: "[shared_edge] GYM OS's hostname, e.g. gym.YOUR-IP.sslip.io"
        required: false
        default: ""
      seed_demo_shared:
        description: "[shared_edge] Also load the demo gym (120 members, every module)"
        type: boolean
        default: false
      restore_dump:
        description: "Path on the server to a pg_dump to restore into GYM OS first, e.g. /tmp/gymos.dump. REPLACES the database. Leave blank to skip."
        required: false
        default: ""
      seed_attendance:
        description: "Write demo attendance history (insert-only, never overwrites a real check-in)"
        type: boolean
        default: false
      seed_attendance_members:
        description: "How many members to give attendance to (default 450)"
        required: false
        default: "450"
      run_daily_seed_now:
        description: "Run today's onboarding (20-30 members) + attendance (450-600) immediately, instead of waiting for the 04:05 cron. The cron is installed either way."
        type: boolean
        default: false

# One deploy at a time. Two installers racing on the same machine would fight
# over the same directories and the Docker daemon.
concurrency:
  group: deploy-oracle
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check the secrets and inputs are set
        env:
          HOST: ${{ secrets.ORACLE_HOST }}
          USER: ${{ secrets.ORACLE_USER }}
          KEY: ${{ secrets.ORACLE_SSH_KEY }}
          SHARED: ${{ inputs.shared_edge }}
          IR_DOMAIN: ${{ inputs.insightrag_domain }}
          GO_DOMAIN: ${{ inputs.gymos_domain }}
        run: |
          missing=""
          [ -n "$HOST" ] || missing="$missing ORACLE_HOST"
          [ -n "$USER" ] || missing="$missing ORACLE_USER"
          [ -n "$KEY" ]  || missing="$missing ORACLE_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ "$SHARED" = "true" ]; then
            [ -n "$IR_DOMAIN" ] || { echo "::error::shared_edge needs insightrag_domain"; exit 1; }
            [ -n "$GO_DOMAIN" ] || { echo "::error::shared_edge needs gymos_domain"; exit 1; }
          fi

      # The runner's own copy of this repo, at the ref that triggered the
      # run. install.sh and migrate-to-shared.sh are piped to the server from
      # here over the SSH connection below, rather than the server curling
      # them from raw.githubusercontent.com: that CDN can lag a push (or, as
      # happened once, 404 outright for reasons outside this repo), and a
      # checkout the runner already has is both faster and not subject to it.
      - uses: actions/checkout@v4

      # Secrets go in through env rather than ${{ }} inside the script, so
      # nothing from them is ever pasted into the shell as code.
      - name: Configure SSH
        env:
          HOST: ${{ secrets.ORACLE_HOST }}
          KEY: ${{ secrets.ORACLE_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::ORACLE_KNOWN_HOSTS is not set; trusting the host key on first use."
            ssh-keyscan -T 15 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Check the server is reachable
        env:
          HOST: ${{ secrets.ORACLE_HOST }}
          USER: ${{ secrets.ORACLE_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ConnectTimeout=20 \
            "$USER@$HOST" 'echo "connected to $(hostname) — $(. /etc/os-release && echo "$PRETTY_NAME")"'

      - name: Run the standalone installer
        if: inputs.shared_edge != true
        env:
          HOST: ${{ secrets.ORACLE_HOST }}
          USER: ${{ secrets.ORACLE_USER }}
          DEPLOY_DOMAIN: ${{ inputs.domain }}
          DEPLOY_SEED: ${{ inputs.seed_demo }}
          DEPLOY_TZ: ${{ inputs.timezone }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # install.sh itself is appended verbatim below, from this runner's
          # own checkout — not curled by the server — so the env exports
          # ahead of it need no quoting trick for anything past this point.
          {
            echo "set -euo pipefail"
            echo "export BRANCH=$(printf '%q' "$BRANCH")"
            [ -n "$DEPLOY_DOMAIN" ] && echo "export DOMAIN=$(printf '%q' "$DEPLOY_DOMAIN")"
            [ "$DEPLOY_SEED" = "true" ] && echo "export SEED_DEMO=1"
            [ -n "$DEPLOY_TZ" ] && echo "export TZ=$(printf '%q' "$DEPLOY_TZ")"
            cat deploy/install.sh
          } > /tmp/remote.sh

          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ConnectTimeout=20 \
            "$USER@$HOST" 'sudo -E bash -s' < /tmp/remote.sh

      # Runs before the deploy so migrate.js then brings the restored schema
      # up to date in the same run — a dump from a developer's machine is
      # often a release or two behind.
      - name: Restore a database dump
        if: inputs.restore_dump != ''
        env:
          HOST: ${{ secrets.ORACLE_HOST }}
          USER: ${{ secrets.ORACLE_USER }}
          DUMP: ${{ inputs.restore_dump }}
        run: |
          {
            echo "set -euo pipefail"
            echo "DUMP=$(printf '%q' "$DUMP")"
            cat <<'REMOTE'
          cd /opt/gym-os
          [ -f "$DUMP" ] || { echo "::error::$DUMP not found on the server"; exit 1; }

          db_user=$(grep -E '^DB_USER=' .env 2>/dev/null | cut -d= -f2- || true); db_user=${db_user:-gymos}
          db_name=$(grep -E '^DB_NAME=' .env 2>/dev/null | cut -d= -f2- || true); db_name=${db_name:-gymdb}

          # Take a dump of what is there first. Restoring is destructive and
          # this is the only copy of whatever it replaces.
          if docker compose -p gym-os ps --status running --services 2>/dev/null | grep -qx postgres; then
            echo "==> Backing up the current database before replacing it"
            GYMOS_DIR=/opt/gym-os ./deploy/backup.sh || echo "warning: pre-restore backup failed"
          fi

          echo "==> Restoring $DUMP"
          docker compose -p gym-os cp "$DUMP" postgres:/tmp/restore.dump
          # pg_restore reports non-fatal noise (ownership, extensions) as
          # errors; --exit-on-error is off, so check the data afterwards
          # rather than trusting the exit code.
          docker compose -p gym-os exec -T postgres \
            pg_restore -U "$db_user" -d "$db_name" --clean --if-exists --no-owner \
            /tmp/restore.dump < /dev/null || echo "pg_restore reported warnings (usually ownership) — verifying below"
          docker compose -p gym-os exec -T postgres rm -f /tmp/restore.dump < /dev/null || true

          members=$(docker compose -p gym-os exec -T postgres \
            psql -U "$db_user" -d "$db_name" -tAc "SELECT count(*) FROM clients" < /dev/null 2>/dev/null | tr -d '[:space:]' || true)
          staff=$(docker compose -p gym-os exec -T postgres \
            psql -U "$db_user" -d "$db_name" -tAc "SELECT count(*) FROM users" < /dev/null 2>/dev/null | tr -d '[:space:]' || true)
          echo "==> Restored: ${members:-?} member record(s), ${staff:-?} staff account(s)"
          REMOTE
          } > /tmp/restore.sh

          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ConnectTimeout=20 \
            "$USER@$HOST" 'sudo -E bash -s' < /tmp/restore.sh

      - name: Run the shared-edge migration
        if: inputs.shared_edge == true
        env:
          HOST: ${{ secrets.ORACLE_HOST }}
          USER: ${{ secrets.ORACLE_USER }}
          IR_DOMAIN: ${{ inputs.insightrag_domain }}
          GO_DOMAIN: ${{ inputs.gymos_domain }}
          # A secret, not an input: workflow_dispatch inputs are echoed into
          # the run log verbatim, and this repository's logs are public.
          # Unset is fine — the script then generates one and writes it to a
          # file on the server instead of printing it.
          ADMIN_PW: ${{ secrets.GYMOS_ADMIN_PASSWORD }}
          SEED: ${{ inputs.seed_demo_shared }}
        run: |
          {
            echo "set -euo pipefail"
            echo "export INSIGHTRAG_DOMAIN=$(printf '%q' "$IR_DOMAIN")"
            echo "export GYMOS_DOMAIN=$(printf '%q' "$GO_DOMAIN")"
            [ -n "$ADMIN_PW" ] && echo "export ADMIN_PASSWORD=$(printf '%q' "$ADMIN_PW")"
            [ "$SEED" = "true" ] && echo "export SEED_DEMO=1"
            cat deploy/edge/migrate-to-shared.sh
          } > /tmp/remote.sh

          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ConnectTimeout=20 \
            "$USER@$HOST" 'sudo -E bash -s' < /tmp/remote.sh

      - name: Check the standalone deploy answers
        if: inputs.shared_edge != true
        env:
          HOST: ${{ secrets.ORACLE_HOST }}
          USER: ${{ secrets.ORACLE_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$USER@$HOST" bash -se <<'REMOTE'
          set -uo pipefail
          cd /opt/gym-os
          domain=$(grep -E '^DOMAIN=' .env | cut -d= -f2-)
          echo "Domain: $domain"
          echo
          echo "-- containers --"
          sudo docker compose -p gym-os ps
          echo
          echo "-- health (from inside the app container) --"
          # < /dev/null on every exec: this whole block is a heredoc on the
          # remote shell's stdin, and docker compose exec forwards stdin to
          # the container -- without it, it eats the rest of THIS script.
          sudo docker compose -p gym-os exec -T app curl -fsS localhost:8080/actuator/health < /dev/null || echo "health check failed"
          echo
          echo "-- staff portal / --"
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" "https://$domain/" || echo "not reachable over HTTPS yet"
          echo "-- the member portal is the same document; #/member is client-side --"
          REMOTE

      # After the migration, so the schema is current, and after the app is
      # up, so a failure here never blocks the deploy itself.
      - name: Seed demo attendance
        if: inputs.seed_attendance == true
        env:
          HOST: ${{ secrets.ORACLE_HOST }}
          USER: ${{ secrets.ORACLE_USER }}
          SEED_MEMBERS: ${{ inputs.seed_attendance_members }}
        run: |
          {
            echo "set -euo pipefail"
            echo "MEMBERS=$(printf '%q' "$SEED_MEMBERS")"
            cat <<'REMOTE'
          cd /opt/gym-os

          # This writes to the live database. Insert-only and ON CONFLICT DO
          # NOTHING, so it cannot overwrite a real check-in, but take the
          # backup anyway — it costs seconds and the alternative is regret.
          echo "==> Backing up before writing"
          GYMOS_DIR=/opt/gym-os ./deploy/backup.sh || echo "warning: pre-seed backup failed"

          echo "==> Seeding attendance for $MEMBERS member(s)"
          docker compose -p gym-os -f docker-compose.yml -f docker-compose.shared-edge.yml \
            run --rm -T -e MEMBERS="$MEMBERS" migrate sh -c "node seed-attendance.js" < /dev/null
          REMOTE
          } > /tmp/seed.sh

          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ConnectTimeout=20 \
            "$USER@$HOST" 'sudo -E bash -s' < /tmp/seed.sh

      # The 04:05 cron (installed by the migration step above) runs this
      # every day regardless. This just runs today's copy of it immediately,
      # for a same-day check that it actually works on the server.
      - name: Run today's onboarding + attendance now
        if: inputs.run_daily_seed_now == true
        env:
          HOST: ${{ secrets.ORACLE_HOST }}
          USER: ${{ secrets.ORACLE_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ConnectTimeout=20 \
            "$USER@$HOST" 'sudo bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/gym-os
          echo "==> Backing up before writing"
          GYMOS_DIR=/opt/gym-os ./deploy/backup.sh || echo "warning: pre-seed backup failed"
          echo "==> Running today's onboarding + attendance"
          docker compose -p gym-os -f docker-compose.yml -f docker-compose.shared-edge.yml \
            run --rm -T migrate sh -c "node seed-daily.js" < /dev/null
          REMOTE

      - name: Check the shared-edge deploy answers
        if: inputs.shared_edge == true
        env:
          HOST: ${{ secrets.ORACLE_HOST }}
          USER: ${{ secrets.ORACLE_USER }}
          IR_DOMAIN: ${{ inputs.insightrag_domain }}
          GO_DOMAIN: ${{ inputs.gymos_domain }}
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$USER@$HOST" \
            "IR_DOMAIN=$(printf '%q' "$IR_DOMAIN") GO_DOMAIN=$(printf '%q' "$GO_DOMAIN") bash -se" <<'REMOTE'
          set -uo pipefail
          echo "-- edge Caddy --"
          sudo docker compose -p edge ps
          echo
          echo "-- InsightRAG --"
          sudo docker compose -p insightrag ps
          echo
          echo "-- GYM OS --"
          sudo docker compose -p gym-os ps
          echo
          echo "-- InsightRAG: $IR_DOMAIN --"
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" "https://$IR_DOMAIN/api/v1/health" || echo "not reachable over HTTPS yet"
          echo "-- GYM OS: $GO_DOMAIN --"
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" "https://$GO_DOMAIN/" || echo "not reachable over HTTPS yet"

          # A deploy that comes up healthy but has no staff account is not a
          # working deploy -- that exact state shipped once and looked green.
          # Count only; never print a credential.
          echo "-- GYM OS staff accounts --"
          cd /opt/gym-os
          # .env is chmod 600 and root-owned, so this needs sudo — it runs as
          # the SSH user. || true because the remote shell is `bash -se`: a
          # grep that matches nothing exits 1 and would end the check.
          db_user=$(sudo grep -E '^DB_USER=' .env 2>/dev/null | cut -d= -f2- || true); db_user=${db_user:-gymos}
          db_name=$(sudo grep -E '^DB_NAME=' .env 2>/dev/null | cut -d= -f2- || true); db_name=${db_name:-gymdb}
          # < /dev/null: this block is a heredoc on the remote shell's stdin,
          # and docker compose exec forwards stdin to the container. Without
          # it the exec swallows the rest of this script, bash reaches EOF and
          # exits 0 -- the check then "passes" having tested nothing, which is
          # exactly what happened on the run before this comment existed.
          admins=$(sudo docker compose -p gym-os exec -T postgres \
            psql -U "$db_user" -d "$db_name" -tAc \
            "SELECT count(*) FROM users WHERE role = 'admin'" < /dev/null 2>/dev/null \
            | tr -d '[:space:]' || true)
          if [ "${admins:-0}" -ge 1 ] 2>/dev/null; then
            echo "$admins admin account(s) present — sign-in is possible"
          else
            echo "::error::no admin account exists — nobody can sign in to GYM OS"
            exit 1
          fi
          REMOTE

      - name: Remove the key from the runner
        if: always()
        run: rm -f ~/.ssh/id_deploy

      - name: Summary
        if: success() && inputs.shared_edge != true
        run: |
          {
            echo "### GYM OS deployed"
            echo
            echo "Both portals are live on the same origin:"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Staff portal | \`https://<domain>/\` |"
            echo "| Member portal | \`https://<domain>/#/member\` |"
            echo
            echo "The domain is printed in the installer step above."
            echo
            echo "First sign-in: the staff account from the \"Making sure a staff account exists\" step."
            echo "A generated password is at /opt/gym-os/db/.admin-credentials on the server (chmod 600)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: success() && inputs.shared_edge == true
        run: |
          {
            echo "### GYM OS + InsightRAG, one shared Caddy"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| InsightRAG | \`https://${{ inputs.insightrag_domain }}/\` |"
            echo "| GYM OS staff | \`https://${{ inputs.gymos_domain }}/\` |"
            echo "| GYM OS members | \`https://${{ inputs.gymos_domain }}/#/member\` |"
            echo
            echo "First sign-in: the staff account from the \"Making sure a staff account exists\" step."
            echo "A generated password is at /opt/gym-os/db/.admin-credentials on the server (chmod 600):"
            echo
            echo "    ssh <user>@<host> 'sudo cat /opt/gym-os/db/.admin-credentials'"
          } >> "$GITHUB_STEP_SUMMARY"
