# Deploy GYM OS to the Oracle Cloud server.
#
# Run it from the Actions tab (or `gh workflow run deploy.yml`). The runner
# checks out this repo, then pipes the deploy script (install.sh or
# migrate-to-shared.sh, whichever mode calls for) straight to the server over
# SSH — the server never fetches anything from GitHub itself. That's
# deliberate: it means the same content the workflow is running from is what
# runs on the server, with no dependency on raw.githubusercontent.com (which
# has 404'd for entire repos before, unrelated to anything in this file) or
# on propagation delay after a push.
#
# The difference from running it by hand is that the key lives in GitHub's
# encrypted secrets rather than on somebody's laptop, and every deploy leaves
# a log.
#
# Two modes, picked by the "shared_edge" input:
#
#   standalone (default) — GYM OS owns the server, runs deploy/install.sh,
#     gets its own Caddy on 80/443.
#
#   shared_edge — the server also runs another app (InsightRAG) with its own
#     Caddy already on 80/443. Runs deploy/edge/migrate-to-shared.sh instead,
#     which puts one shared Caddy in front of both. See docs/deployment.md,
#     "Hosting alongside another app on the same server", before using this.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#
#   ORACLE_HOST         the instance's public IP or hostname
#   ORACLE_USER         the SSH user — 'ubuntu' on Oracle's Ubuntu images
#   ORACLE_SSH_KEY      the PRIVATE key, whole file including the
#                       -----BEGIN ... ----- and -----END ... ----- lines
#
# Optional:
#
#   ORACLE_KNOWN_HOSTS  output of `ssh-keyscan <host>`. Set it to pin the
#                       server's host key. Without it this workflow accepts
#                       whatever key the host presents on the first connect,
#                       which trusts the network for that moment.

name: Deploy to Oracle

on:
  workflow_dispatch:
    inputs:
      shared_edge:
        description: "Server also hosts another app (InsightRAG) — use the shared Caddy migration instead of standalone install"
        type: boolean
        default: false
      domain:
        description: "[standalone] Public hostname (blank = <public-ip>.sslip.io)"
        required: false
        default: ""
      seed_demo:
        description: "[standalone] Also load the demo gym (120 members, every module)"
        type: boolean
        default: false
      timezone:
        description: "[standalone] Local time for reports, schedules and expiry dates"
        required: false
        default: "Asia/Kolkata"
      insightrag_domain:
        description: "[shared_edge] InsightRAG's hostname, e.g. insightrag.YOUR-IP.sslip.io"
        required: false
        default: ""
      gymos_domain:
        description: "[shared_edge] GYM OS's hostname, e.g. gym.YOUR-IP.sslip.io"
        required: false
        default: ""

# One deploy at a time. Two installers racing on the same machine would fight
# over the same directories and the Docker daemon.
concurrency:
  group: deploy-oracle
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check the secrets and inputs are set
        env:
          HOST: ${{ secrets.ORACLE_HOST }}
          USER: ${{ secrets.ORACLE_USER }}
          KEY: ${{ secrets.ORACLE_SSH_KEY }}
          SHARED: ${{ inputs.shared_edge }}
          IR_DOMAIN: ${{ inputs.insightrag_domain }}
          GO_DOMAIN: ${{ inputs.gymos_domain }}
        run: |
          missing=""
          [ -n "$HOST" ] || missing="$missing ORACLE_HOST"
          [ -n "$USER" ] || missing="$missing ORACLE_USER"
          [ -n "$KEY" ]  || missing="$missing ORACLE_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ "$SHARED" = "true" ]; then
            [ -n "$IR_DOMAIN" ] || { echo "::error::shared_edge needs insightrag_domain"; exit 1; }
            [ -n "$GO_DOMAIN" ] || { echo "::error::shared_edge needs gymos_domain"; exit 1; }
          fi

      # The runner's own copy of this repo, at the ref that triggered the
      # run. install.sh and migrate-to-shared.sh are piped to the server from
      # here over the SSH connection below, rather than the server curling
      # them from raw.githubusercontent.com: that CDN can lag a push (or, as
      # happened once, 404 outright for reasons outside this repo), and a
      # checkout the runner already has is both faster and not subject to it.
      - uses: actions/checkout@v4

      # Secrets go in through env rather than ${{ }} inside the script, so
      # nothing from them is ever pasted into the shell as code.
      - name: Configure SSH
        env:
          HOST: ${{ secrets.ORACLE_HOST }}
          KEY: ${{ secrets.ORACLE_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::ORACLE_KNOWN_HOSTS is not set; trusting the host key on first use."
            ssh-keyscan -T 15 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Check the server is reachable
        env:
          HOST: ${{ secrets.ORACLE_HOST }}
          USER: ${{ secrets.ORACLE_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ConnectTimeout=20 \
            "$USER@$HOST" 'echo "connected to $(hostname) — $(. /etc/os-release && echo "$PRETTY_NAME")"'

      - name: Run the standalone installer
        if: inputs.shared_edge != true
        env:
          HOST: ${{ secrets.ORACLE_HOST }}
          USER: ${{ secrets.ORACLE_USER }}
          DEPLOY_DOMAIN: ${{ inputs.domain }}
          DEPLOY_SEED: ${{ inputs.seed_demo }}
          DEPLOY_TZ: ${{ inputs.timezone }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # install.sh itself is appended verbatim below, from this runner's
          # own checkout — not curled by the server — so the env exports
          # ahead of it need no quoting trick for anything past this point.
          {
            echo "set -euo pipefail"
            echo "export BRANCH=$(printf '%q' "$BRANCH")"
            [ -n "$DEPLOY_DOMAIN" ] && echo "export DOMAIN=$(printf '%q' "$DEPLOY_DOMAIN")"
            [ "$DEPLOY_SEED" = "true" ] && echo "export SEED_DEMO=1"
            [ -n "$DEPLOY_TZ" ] && echo "export TZ=$(printf '%q' "$DEPLOY_TZ")"
            cat deploy/install.sh
          } > /tmp/remote.sh

          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ConnectTimeout=20 \
            "$USER@$HOST" 'sudo -E bash -s' < /tmp/remote.sh

      - name: Run the shared-edge migration
        if: inputs.shared_edge == true
        env:
          HOST: ${{ secrets.ORACLE_HOST }}
          USER: ${{ secrets.ORACLE_USER }}
          IR_DOMAIN: ${{ inputs.insightrag_domain }}
          GO_DOMAIN: ${{ inputs.gymos_domain }}
        run: |
          {
            echo "set -euo pipefail"
            echo "export INSIGHTRAG_DOMAIN=$(printf '%q' "$IR_DOMAIN")"
            echo "export GYMOS_DOMAIN=$(printf '%q' "$GO_DOMAIN")"
            cat deploy/edge/migrate-to-shared.sh
          } > /tmp/remote.sh

          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ConnectTimeout=20 \
            "$USER@$HOST" 'sudo -E bash -s' < /tmp/remote.sh

      - name: Check the standalone deploy answers
        if: inputs.shared_edge != true
        env:
          HOST: ${{ secrets.ORACLE_HOST }}
          USER: ${{ secrets.ORACLE_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$USER@$HOST" bash -se <<'REMOTE'
          set -uo pipefail
          cd /opt/gym-os
          domain=$(grep -E '^DOMAIN=' .env | cut -d= -f2-)
          echo "Domain: $domain"
          echo
          echo "-- containers --"
          sudo docker compose -p gym-os ps
          echo
          echo "-- health (from inside the app container) --"
          sudo docker compose -p gym-os exec -T app curl -fsS localhost:8080/actuator/health || echo "health check failed"
          echo
          echo "-- staff portal / --"
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" "https://$domain/" || echo "not reachable over HTTPS yet"
          echo "-- the member portal is the same document; #/member is client-side --"
          REMOTE

      - name: Check the shared-edge deploy answers
        if: inputs.shared_edge == true
        env:
          HOST: ${{ secrets.ORACLE_HOST }}
          USER: ${{ secrets.ORACLE_USER }}
          IR_DOMAIN: ${{ inputs.insightrag_domain }}
          GO_DOMAIN: ${{ inputs.gymos_domain }}
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$USER@$HOST" \
            "IR_DOMAIN=$(printf '%q' "$IR_DOMAIN") GO_DOMAIN=$(printf '%q' "$GO_DOMAIN") bash -se" <<'REMOTE'
          set -uo pipefail
          echo "-- edge Caddy --"
          sudo docker compose -p edge ps
          echo
          echo "-- InsightRAG --"
          sudo docker compose -p insightrag ps
          echo
          echo "-- GYM OS --"
          sudo docker compose -p gym-os ps
          echo
          echo "-- InsightRAG: $IR_DOMAIN --"
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" "https://$IR_DOMAIN/api/v1/health" || echo "not reachable over HTTPS yet"
          echo "-- GYM OS: $GO_DOMAIN --"
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" "https://$GO_DOMAIN/" || echo "not reachable over HTTPS yet"
          REMOTE

      - name: Remove the key from the runner
        if: always()
        run: rm -f ~/.ssh/id_deploy

      - name: Summary
        if: success() && inputs.shared_edge != true
        run: |
          {
            echo "### GYM OS deployed"
            echo
            echo "Both portals are live on the same origin:"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Staff portal | \`https://<domain>/\` |"
            echo "| Member portal | \`https://<domain>/#/member\` |"
            echo
            echo "The domain is printed in the installer step above."
            echo
            echo "If this was the first deploy, change the \`admin\`/\`admin123\` password now."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: success() && inputs.shared_edge == true
        run: |
          {
            echo "### GYM OS + InsightRAG, one shared Caddy"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| InsightRAG | \`https://${{ inputs.insightrag_domain }}/\` |"
            echo "| GYM OS staff | \`https://${{ inputs.gymos_domain }}/\` |"
            echo "| GYM OS members | \`https://${{ inputs.gymos_domain }}/#/member\` |"
            echo
            echo "If this was GYM OS's first deploy, change the \`admin\`/\`admin123\` password now."
          } >> "$GITHUB_STEP_SUMMARY"
