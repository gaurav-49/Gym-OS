# Production overrides for a single public server (see docs/deployment.md).
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Differences from local development:
#   * Only Caddy is reachable from the internet (80/443, automatic HTTPS).
#     Postgres and the app are no longer published on the host.
#   * The 'prod' Spring profile is on, so the app refuses to start without a
#     real JWT_SECRET instead of quietly signing tokens with a throwaway one.
#   * Every service restarts automatically and has a memory ceiling that fits
#     an Oracle Cloud Always Free machine.

services:
  postgres:
    ports: !reset []
    restart: unless-stopped
    mem_limit: 1g
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}

  migrate:
    # One-shot: runs to completion on every deploy, then stays stopped.
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}

  app:
    ports: !reset []
    restart: unless-stopped
    mem_limit: 1536m
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (at least 32 random characters)}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env (e.g. gym-os.duckdns.org)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
