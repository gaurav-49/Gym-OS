# ─────────────────────────────────────────────────────────────────────────────
#  This gym's identity. Edit this one file to rebrand the whole product.
#
#  GYM OS is sold to many gyms, so nothing gym-facing is hard-coded: the staff
#  sidebar, both login screens, the member portal, invoices and reminder
#  messages all read these values. "GYM OS" itself survives only as the small
#  "Powered by" line in the footer, which gym.branding.powered-by can switch off.
#
#  Three ways to set these, in increasing precedence:
#    1. this file, bundled in the war        — the shipped install
#    2. branding.properties next to the war  — per-site, no rebuild needed
#    3. environment variables (GYM_BRANDING_NAME, …) — containers and CI
#
#  A gym admin editing branding in the app writes to the database, and that
#  wins over all three: this file is the starting point, not a lock.
# ─────────────────────────────────────────────────────────────────────────────

gym.branding.name=Gold's Gym, Jehanabad
gym.branding.tagline=Management System
gym.branding.logo=🏋️
gym.branding.colour=#059669

# A line of the gym's own on the sign-in screen. Blank leaves it off.
gym.branding.quote=Nobody starts knowing how. That's what we're for.

# Shown on invoices and receipts. Blank means "leave the line off".
gym.branding.phone=
gym.branding.email=
gym.branding.address=
gym.branding.website=

# Printed on receipts AND invoices — the two share one document design, so
# they share this small print. GSTIN leaves its line off when blank; the note
# is the gym's own footer — refund policy, freeze rules, a thank-you.
# The series every tax invoice is numbered in: <prefix>-<year>-<0001>.
gym.branding.invoice-prefix=INV

gym.branding.gstin=
gym.branding.receipt-note=Fees once paid are non-refundable and non-transferable. Please quote the number above for any query.

# The "Powered by GYM OS" footer. Set to false for a fully white-label install.
gym.branding.powered-by=true
